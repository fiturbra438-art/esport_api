name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:fitur1206@localhost:5432/TOURNAMEN_ESPORT
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fitur1206
          POSTGRES_DB: TOURNAMEN_ESPORT
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d TOURNAMEN_ESPORT"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Install SQLx CLI
      run: cargo install sqlx-cli --version 0.7.4 --no-default-features --features postgres,rustls --locked
    - name: Run database migrations
      run: sqlx migrate run
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
