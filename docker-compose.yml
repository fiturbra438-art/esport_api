services:
  db:
    image: postgres:15-alpine
    container_name: esport_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin1206
      POSTGRES_DB: TOURNAMEN_ESPORT
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: